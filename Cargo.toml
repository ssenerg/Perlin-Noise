[package]
name = "perlin-noise"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Perlin noise in any number of dimensions, with a renderer that turns a field into an image."
repository = "https://github.com/ssenerg/Perlin-Noise"
readme = "README.md"

[lib]
name = "perlin_noise"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.2", optional = true }
png = { version = "0.18.1", optional = true }
pollster = { version = "1.0.1", optional = true }
pyo3 = { version = "0.26", optional = true }
wgpu = { version = "30.0.1", optional = true }

[features]
default = []
# Evaluate full tables with a compute shader through wgpu.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Write rendered images with Image::write_png.
png = ["dep:png"]
# Python bindings. Maturin turns this into an extension module.
python = ["dep:pyo3", "png"]

[[example]]
name = "render"
required-features = ["png"]

[[example]]
name = "image"
required-features = ["png"]
